<!DOCTYPE html>
<html lang="en">

<head>

<body>
    <h1 style="border: 2px solid; text-align: center;">Calculate Average Marks</h1>

            <label for="">Maths</label>

        <div>

        <div>

        </div>
    </form>
</body>
